site_name: Obsidian Documentation System
site_description: Documentation demo generated from Obsidian using MkDocs Material
site_url: https://giulia007.github.io/obsidian-docsystem/
repo_url: https://github.com/Giulia007/obsidian-docsystem

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - footnotes
  - codehilite
  - toc:
      permalink: true

extra_css:
  - styles/custom.css

nav:
  - Home: index.md
  - System:
    - Architecture Overview: system/System Architecture Overview.md
    - Design Decisions: system/Design Decisions.md
    - System Conventions: system/System Conventions.md
    - Documentation Structure MOC: system/Documentation Structure MOC.md
  - Workflows:
    - Index Generation: workflows/Index Generation.md
    - Timestamp Maintenance: workflows/Timestamp Maintenance.md
    - AI Summary Generation: workflows/AI Summary Generation.md
  - API:
    - Metadata API Example: api/Metadata API Example.md